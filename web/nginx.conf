server {
  listen 80;
  server_name _;

  # Bật gzip cho asset tĩnh.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

  root /usr/share/nginx/html;
  index index.html;

  # Cache lâu cho asset có hash (Vite tạo file với content hash trong tên).
  location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Proxy mọi request /api/* sang backend container.
  # Tên service "backend" tra từ docker-compose DNS.
  location /api/ {
    proxy_pass         http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # Upload / response lớn.
    client_max_body_size 10m;
    proxy_read_timeout   60s;
    proxy_send_timeout   60s;
  }

  # SPA fallback — mọi route khác đều phục vụ index.html để React Router xử lý.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
