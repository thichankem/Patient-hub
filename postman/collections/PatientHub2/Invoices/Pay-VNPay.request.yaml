$kind: http-request
name: Pay VNPay (Patient) — returns vnp_url to redirect browser to
method: POST
url: '{{baseUrl}}/invoices/{{invoiceId}}/pay-vnpay'
order: 2000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "bank_code": "NCB"
    }
