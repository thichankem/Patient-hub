$kind: http-request
name: Pay Cash (Cashier)
method: POST
url: '{{baseUrl}}/invoices/{{invoiceId}}/pay-cash'
order: 3000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "received_amount": 500000
    }
