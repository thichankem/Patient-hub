$kind: http-request
name: Set Account Active
method: PATCH
url: '{{baseUrl}}/staff/accounts/{{userId}}'
order: 2000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "is_active": true
    }
