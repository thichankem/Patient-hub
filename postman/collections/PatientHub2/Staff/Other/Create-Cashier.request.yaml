$kind: http-request
name: Create Cashier
method: POST
url: '{{baseUrl}}/staff/cashiers'
order: 1000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "username": "cashier01",
      "password": "password123"
    }
