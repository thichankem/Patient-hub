$kind: http-request
name: Create Department
method: POST
url: '{{baseUrl}}/departments'
order: 3000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Cardiology",
      "description": "Heart and cardiovascular department"
    }
