$kind: http-request
name: Reassign Doctor
method: PATCH
url: '{{baseUrl}}/appointments/{{appointmentId}}/reassign'
order: 6000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "doctor_id": "{{doctorId}}"
    }
