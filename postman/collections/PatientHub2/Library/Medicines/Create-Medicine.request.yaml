$kind: http-request
name: Create Medicine
method: POST
url: '{{baseUrl}}/library/medicines'
order: 3000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Paracetamol",
      "description": "Pain reliever and fever reducer",
      "usage": "Take 1-2 tablets every 4-6 hours",
      "side_effects": "Nausea, liver damage in overdose",
      "price": "5000.00",
      "insurance_price": "3000.00"
    }
