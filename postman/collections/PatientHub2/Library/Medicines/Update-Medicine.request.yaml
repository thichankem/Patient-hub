$kind: http-request
name: Update Medicine
method: PATCH
url: '{{baseUrl}}/library/medicines/{{medicineId}}'
order: 4000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "price": "6000.00",
      "insurance_price": "3500.00"
    }
