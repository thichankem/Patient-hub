$kind: http-request
name: Update Disease
method: PATCH
url: '{{baseUrl}}/library/diseases/{{diseaseId}}'
order: 4000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Hypertension Updated",
      "description": "Updated description"
    }
