$kind: http-request
name: Create Procedure
method: POST
url: '{{baseUrl}}/library/procedures'
order: 3000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "ECG",
      "description": "Electrocardiogram procedure"
    }
