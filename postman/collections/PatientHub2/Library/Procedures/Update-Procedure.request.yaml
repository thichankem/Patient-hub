$kind: http-request
name: Update Procedure
method: PATCH
url: '{{baseUrl}}/library/procedures/{{procedureId}}'
order: 4000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "ECG Updated",
      "description": "Updated description"
    }
