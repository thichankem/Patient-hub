$kind: http-request
name: Create Lab Room
method: POST
url: '{{baseUrl}}/lab-rooms'
order: 3000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Lab Room A",
      "test_type_id": "{{testTypeId}}"
    }
