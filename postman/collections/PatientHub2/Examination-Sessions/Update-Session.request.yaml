$kind: http-request
name: 'Update Session (Doctor)'
method: PATCH
url: '{{baseUrl}}/examination-sessions/{{sessionId}}'
order: 6000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "diagnosis": "Hypertension stage 1",
      "treatment_plan": "Medication and follow-up in 2 weeks"
    }
