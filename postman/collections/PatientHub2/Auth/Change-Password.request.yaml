$kind: http-request
name: Change Password
method: POST
url: '{{baseUrl}}/auth/change-password'
order: 3000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "oldPassword": "password123",
      "newPassword": "newpassword456"
    }
